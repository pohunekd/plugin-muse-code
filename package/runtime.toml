# Runtime descriptor of the Muse Code package.
#
# Verified against Muse Code 1.4.14 (compat/RELEASE). The supported release
# range below is `[min, below)`: `below` stays at the next minor until the
# captures of a newer release pass.

schema = 1
id = "pohunek.runtime.muse"
version = "0.1.0"
runtime_api = 1
requires = ["version-probe-revision-v1", "launch-env-v1", "input-refuse-while-blocked-v1", "config-home-subdir-v1", "integration-muse-hook-v1", "transcripts-data-root-v1"]

[runtime]
id = "muse"
name = "Muse Code"
program = "muse"
# A Pohunek project is registered on purpose, so every launch trusts its
# workspace and the trust dialog never holds it. Trust loads the checkout's
# project hooks, rules and skills, and project hooks run outside Muse's
# sandbox, so a checkout of a foreign PR or fork head runs that head's hooks
# (#18). Resume reuses these arguments; fork is unsupported.
args = ["--trust-workspace"]
detect_manifest = "detect.toml"
# Typed into the composer once it is drawn: a positional argument would let a
# prompt such as `logout` select a subcommand.
prompt_arg = false
# `muse --version` prints `Muse Code <release> (<release>-R<n>.<m>)` on stdout;
# the leading release is the one compared, the parenthesised id is the
# annotation.
version_probe = { parser = "semver-revision-line-v1", args = ["--version"], min = "1.4.14", below = "1.5.0", line = "Muse Code {version} {annotation}" }

# The launcher replaces its binary in the background on every start unless
# told not to; a pinned release must not change under a running host.
[launch_env]
MUSE_NO_AUTO_UPDATE = "1"

# Muse enables bracketed paste and the kitty keyboard protocol in its startup
# burst, before it draws a screen, so the enable signal is not readiness: only
# the rendered composer (detect rule `idle_composer`) shows that it reads input.
[input]
bracketed_paste = true
submit_delay_ms = 150
text_policy = "unrestricted"
ready = "screen_idle"
# Every Muse dialog (trust, sign-in, approval, question) takes Enter as the
# choice of its preselected entry, so text sent while one shows would answer
# it unseen (measured on the trust dialog; unverified on sign-in, approval and
# question); the operator answers through `pohunek attach`.
refuse_while_blocked = true

# `muse resume <id>` continues a stopped session in its workspace; the hook
# overlay's `-c` arguments come before `resume`.
[resume]
supported = true
reference_kind = "id"
args = ["resume", "{reference}"]

# Muse forks only inside its TUI (`/fork`); no launch argument forks.
[fork]
supported = false

# Muse chooses the session id; the root thread's SessionStart hook reports it
# with the first turn. After `/clear` Muse 1.4.14 runs that hook without the
# Pohunek variables, so the reference stays on the session before `/clear`.
[native_reference]
strategy = "hook"

# Recovery needs the session's own log: `<uuid>/session.jsonl` three dated
# levels (`YYYY/MM/DD`) below the data root's `muse/sessions`.
[native_reference.existence]
check = "file"
root_env = "XDG_DATA_HOME"
root_home = ".local/share"
dir = "muse/sessions"
dir_name = "{reference}"
file_name = "session.jsonl"
max_depth = 3

[integration]
handler = "muse-hook-v1"
hook_schema = "identity-subagent-v1"

# Muse reads `settings.json`, and the managed hooks file it may name, from
# `$XDG_CONFIG_HOME/muse`, else `~/.config/muse`.
[config_home]
env = "XDG_CONFIG_HOME"
subdir = "muse"
default = ".config/muse"

# Session logs live in the data root, not the config home; the observer reads
# the first `runtime.session.metadata` record of each
# `YYYY/MM/DD/<uuid>/session.jsonl`.
[transcripts]
parser = "muse-session-v1"
root_env = "XDG_DATA_HOME"
root_home = ".local/share"
dir = "muse/sessions"
max_depth = 4
