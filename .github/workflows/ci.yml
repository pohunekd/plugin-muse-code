name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels its older run; main runs are never
# cancelled so every merge commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools
        run: sudo apt-get install --yes --no-install-recommends tmux jq socat
      - name: shellcheck
        # Pinned so CI and local runs agree; the apt package is older.
        run: |
          python3 -m venv "$RUNNER_TEMP/sc"
          "$RUNNER_TEMP/sc/bin/pip" install --quiet shellcheck-py==0.11.0.1
          "$RUNNER_TEMP/sc/bin/shellcheck" scripts/capture scripts/hook-log scripts/model-stub scripts/smoke
      - name: capture dry run
        run: scripts/capture --root "$RUNNER_TEMP/capture" --dry-run all
      - name: evidence carries no credential or home path
        # The kit never logs in; a credential-shaped string in compat/ is a bug.
        run: |
          if grep -rEI 'META_API_KEY=[^ ]|Bearer [A-Za-z0-9._-]{20,}|"api_key"|/(home|Users|root)/[A-Za-z0-9._-]+' compat; then
            echo "credential or home path in compat/" >&2
            exit 1
          fi

  package:
    # Stand-in for the pohunek plugin kit (lint, double build, detect-check): it
    # loads `package/` through the daemon crate of the core release named in
    # kit/Cargo.toml.
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        # The channel in kit/rust-toolchain.toml is the pin of the core rev.
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' kit/rust-toolchain.toml)" --profile minimal
      - name: kit tests
        working-directory: kit
        run: cargo test --locked
